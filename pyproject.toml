[project]
name = "swatorbuy"
version = "0.1.0"
description = "Ad creative, judged by a simulated fruit fly brain (MaleCNS v1.0 connectome)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "Pillow>=10",
  "opencv-python-headless>=4.10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
swat = "swatorbuy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["swatorbuy*"]

[tool.setuptools.package-data]
"swatorbuy.fly" = ["*.json", "*.cpp"]
"swatorbuy.web" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["fly: needs the prepared MaleCNS graph under SWAT_DATA (slow)"]
